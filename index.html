<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>염색체 관찰소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f1f5ee;
    --surface:#ffffff;
    --surface-2:#eaf1e6;
    --ink:#1c271f;
    --ink-soft:#57685c;
    --line:#dbe3d5;
    --accent:#3f7a5c;
    --accent-strong:#254a37;
    --accent-soft:#dcefe2;
    --chromo-mom:#d5445e;
    --chromo-dad:#2e69ad;
    --danger:#b23f35;
    --danger-soft:#f7e0dd;
    --success:#2c7a4b;
    --success-soft:#dcefe2;
    --cell-grad-in:#fffaf0;
    --cell-grad-out:#f2cf7f;
    --cell-line:#dcb45f;
    --slot-fill:#3f7a5c;
    --spindle:#9a8f6a;
    --shadow:0 1px 2px rgba(28,39,31,0.06), 0 8px 24px -12px rgba(28,39,31,0.18);
    --svg-shadow: drop-shadow(0 3px 8px rgba(28,39,31,0.16));
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101712;
      --surface:#171f19;
      --surface-2:#1e2921;
      --ink:#e9efe6;
      --ink-soft:#a6b6ab;
      --line:#2a352d;
      --accent:#72c096;
      --accent-strong:#9adcb8;
      --accent-soft:#20362a;
      --chromo-mom:#f0808f;
      --chromo-dad:#7fb0e6;
      --danger:#e58f84;
      --danger-soft:#3a2420;
      --success:#72c096;
      --success-soft:#1e3226;
      --cell-grad-in:#40331a;
      --cell-grad-out:#1c1509;
      --cell-line:#5c4a28;
      --slot-fill:#72c096;
      --spindle:#c9bd91;
      --shadow:0 1px 2px rgba(0,0,0,0.4), 0 12px 28px -14px rgba(0,0,0,0.6);
      --svg-shadow: drop-shadow(0 3px 10px rgba(0,0,0,0.55));
    }
  }
  :root[data-theme="dark"]{
    --bg:#101712;
    --surface:#171f19;
    --surface-2:#1e2921;
    --ink:#e9efe6;
    --ink-soft:#a6b6ab;
    --line:#2a352d;
    --accent:#72c096;
    --accent-strong:#9adcb8;
    --accent-soft:#20362a;
    --chromo-mom:#f0808f;
    --chromo-dad:#7fb0e6;
    --danger:#e58f84;
    --danger-soft:#3a2420;
    --success:#72c096;
    --success-soft:#1e3226;
    --cell-grad-in:#40331a;
    --cell-grad-out:#1c1509;
    --cell-line:#5c4a28;
    --slot-fill:#72c096;
    --spindle:#c9bd91;
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 12px 28px -14px rgba(0,0,0,0.6);
    --svg-shadow: drop-shadow(0 3px 10px rgba(0,0,0,0.55));
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans KR','Noto Sans KR',sans-serif;
    line-height:1.6;
  }
  h1,h2,h3,.display{
    font-family:'Gowun Batang','Noto Serif KR',serif;
    text-wrap:balance;
    font-weight:700;
    color:var(--ink);
  }
  .mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:0.02em; }
  button{ font-family:inherit; }
  button:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--accent);
    outline-offset:2px;
  }
  a{ color:var(--accent-strong); }

  #app{ max-width:1000px; margin:0 auto; padding:20px 20px 64px; }

  /* ---------- header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:10px 2px 22px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{ font-size:1.5rem; }
  .brand h1{ font-size:1.35rem; margin:0; }
  .brand .tag{ font-size:0.78rem; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }
  .home-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface); color:var(--ink-soft);
    border:1px solid var(--line); border-radius:999px;
    padding:7px 14px; font-size:0.85rem; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .home-btn:hover{ border-color:var(--accent); color:var(--accent-strong); }

  /* ---------- home ---------- */
  .intro{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:26px 28px; margin-bottom:26px; box-shadow:var(--shadow);
  }
  .intro h2{ font-size:1.5rem; margin:0 0 10px; }
  .intro p{ margin:0; color:var(--ink-soft); max-width:64ch; font-size:0.98rem; }
  .intro .unit-badge{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:0.72rem;
    background:var(--accent-soft); color:var(--accent-strong); padding:3px 10px;
    border-radius:999px; margin-bottom:12px; letter-spacing:0.02em;
  }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:680px){ .mode-grid{ grid-template-columns:1fr; } }

  .mode-card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:22px; display:flex; flex-direction:column; gap:14px;
    box-shadow:var(--shadow); text-align:left;
    cursor:pointer; transition:transform .18s ease, border-color .18s ease;
  }
  .mode-card:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .mode-preview{ background:var(--surface-2); border-radius:12px; padding:8px; border:1px solid var(--line); }
  .mode-preview svg{ display:block; width:100%; height:auto; filter:var(--svg-shadow); }
  .mode-card h3{ font-size:1.2rem; margin:0; }
  .mode-card .desc{ color:var(--ink-soft); font-size:0.9rem; margin:0; flex:1; }
  .mode-card .meta{ display:flex; gap:14px; font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--ink-soft); }
  .mode-card .cta{
    align-self:flex-start; background:var(--accent); color:#fff;
    border:none; border-radius:10px; padding:9px 16px; font-weight:600;
    font-size:0.88rem; cursor:pointer;
  }
  .mode-card.mitosis .cta{ background:var(--chromo-mom); }
  .mode-card.meiosis .cta{ background:var(--chromo-dad); }

  .legend{
    display:flex; gap:18px; align-items:center; flex-wrap:wrap;
    margin-top:22px; padding:14px 18px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; font-size:0.83rem; color:var(--ink-soft);
  }
  .legend .swatch{ display:inline-flex; align-items:center; gap:6px; }
  .legend .dot{ width:13px; height:13px; border-radius:4px; display:inline-block; }

  /* ---------- stepper ---------- */
  .stepper{ display:flex; gap:6px; overflow-x:auto; padding:4px 2px 18px; scrollbar-width:thin; }
  .step{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px; font-size:0.78rem;
    background:var(--surface); border:1px solid var(--line); color:var(--ink-soft);
    white-space:nowrap;
  }
  .step .n{
    width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center;
    justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:0.68rem;
    background:var(--surface-2); color:var(--ink-soft);
  }
  .step.done{ color:var(--accent-strong); border-color:var(--accent-soft); }
  .step.done .n{ background:var(--accent); color:#fff; }
  .step.current{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); font-weight:600; }
  .step.current .n{ background:var(--accent); color:#fff; }

  /* ---------- stage layout ---------- */
  .stage-head{ margin-bottom:6px; }
  .stage-head .kicker{
    font-family:'IBM Plex Mono',monospace; font-size:0.75rem; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .stage-head h2{ font-size:1.4rem; margin:4px 0 2px; }

  .layout{ display:grid; grid-template-columns:250px 1fr; gap:20px; align-items:start; margin-top:16px; }
  @media (max-width:760px){ .layout{ grid-template-columns:1fr; } }

  .ref-panel{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px; position:sticky; top:16px; box-shadow:var(--shadow);
  }
  .ref-panel .label{
    font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;
  }
  .ref-panel .ref-title{ font-weight:600; margin-bottom:10px; }
  .ref-panel .ref-diagram{ background:var(--surface-2); border-radius:10px; border:1px solid var(--line); padding:6px; }
  .ref-panel .ref-diagram svg{ display:block; width:100%; height:auto; filter:var(--svg-shadow); }
  .ref-panel .ref-note{ font-size:0.82rem; color:var(--ink-soft); margin-top:10px; }

  /* ---------- interphase intro screen ---------- */
  .intro-lead{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px 20px; margin:10px 0 18px; box-shadow:var(--shadow); font-size:0.95rem;
  }
  .intro-split{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:20px; }
  @media (max-width:680px){ .intro-split{ grid-template-columns:1fr; } }
  .intro-panel{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px; box-shadow:var(--shadow);
  }
  .intro-panel-title{ font-weight:600; margin-bottom:10px; }
  .intro-diagram{ background:var(--surface-2); border-radius:10px; border:1px solid var(--line); padding:6px; }
  .intro-diagram svg{ display:block; width:100%; height:auto; filter:var(--svg-shadow); }
  .intro-panel p{ font-size:0.88rem; color:var(--ink-soft); margin:10px 0 0; }

  .question-panel{ min-width:0; position:relative; }
  .prompt{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px 20px; margin-bottom:14px; box-shadow:var(--shadow); font-size:1.0rem;
  }
  .prompt b{ color:var(--accent-strong); }

  .workspace{
    position:relative; aspect-ratio:300/210; width:100%; max-width:560px;
    margin:0 auto 14px; border-radius:16px; overflow:visible;
  }
  .workspace .bg-layer{ position:absolute; inset:0; }
  .workspace .bg-layer svg{ display:block; width:100%; height:100%; filter:var(--svg-shadow); }
  .workspace .pieces-layer{ position:absolute; inset:0; pointer-events:none; }

  .piece{
    width:56px; height:70px; touch-action:none; user-select:none;
  }
  .piece svg{ display:block; width:100%; height:100%; }
  .piece.in-tray{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); cursor:grab; padding:2px;
  }
  .piece.in-tray:hover{ border-color:var(--accent); }
  .piece.dragging{
    cursor:grabbing; z-index:80; box-shadow:0 10px 24px -8px rgba(0,0,0,0.35);
    background:var(--surface); border:1px solid var(--accent); border-radius:10px;
  }
  .piece.placed{ pointer-events:none; }
  .piece.shake{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:translate(-50%,-50%); }
    25%{ transform:translate(calc(-50% - 5px),-50%); }
    75%{ transform:translate(calc(-50% + 5px),-50%); }
  }

  .tray{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    background:var(--surface-2); border:1px dashed var(--line); border-radius:14px;
    padding:14px; min-height:88px;
  }
  .tray-label{
    font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.05em; width:100%; text-align:center; margin-bottom:2px;
  }
  .drag-layer{ position:absolute; inset:0; pointer-events:none; z-index:60; }

  .feedback{
    margin-top:14px; border-radius:14px; padding:14px 18px; font-size:0.92rem;
    border:1px solid var(--line); display:flex; gap:12px; align-items:flex-start;
  }
  .feedback.ok{ background:var(--success-soft); border-color:var(--success); }
  .feedback.no{ background:var(--danger-soft); border-color:var(--danger); }
  .feedback .icon{ font-size:1.2rem; line-height:1; }
  .feedback .body b{ display:block; margin-bottom:4px; }
  .feedback .body p{ margin:0; color:var(--ink); }
  .next-btn{
    margin-top:14px; background:var(--accent); color:#fff; border:none;
    border-radius:10px; padding:10px 18px; font-weight:600; font-size:0.92rem; cursor:pointer;
  }
  .next-btn:hover{ background:var(--accent-strong); }

  /* ---------- complete ---------- */
  .complete{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:28px; box-shadow:var(--shadow); }
  .complete h2{ font-size:1.5rem; margin:0 0 6px; }
  .complete p.lead{ color:var(--ink-soft); margin:0 0 20px; }
  table.compare{ width:100%; border-collapse:collapse; font-size:0.88rem; margin-bottom:22px; }
  table.compare th, table.compare td{ border:1px solid var(--line); padding:9px 12px; text-align:left; vertical-align:top; }
  table.compare thead th{ background:var(--surface-2); font-family:'IBM Plex Mono',monospace; font-size:0.75rem; }
  table.compare td.hl-mitosis{ color:var(--chromo-mom); font-weight:600; }
  table.compare td.hl-meiosis{ color:var(--chromo-dad); font-weight:600; }
  .compare-wrap{ overflow-x:auto; }
  .complete-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn-secondary{ background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-weight:600; font-size:0.9rem; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 16px; font-weight:600; font-size:0.9rem; cursor:pointer; }

  footer.foot{ text-align:center; color:var(--ink-soft); font-size:0.78rem; margin-top:36px; }

  @media (prefers-reduced-motion: reduce){
    .mode-card{ transition:none; }
    .piece.shake{ animation:none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ============ low-level chromosome / cell drawing ============ */

  var _gid = 0;

  function chromoNode(state, color, L, w){
    if(state==='loose' || state==='loose2'){
      /* interphase chromatin: a thin, loosely wound thread. 'loose' = before
         DNA replication (one DNA molecule per thread). 'loose2' = after
         replication: the DNA amount has doubled, but the thread is still
         uncondensed, so the two copies are drawn as two thin strands running
         very close together rather than as a distinct, separable X shape —
         sister chromatids are NOT visually distinguishable at this point,
         which is scientifically accurate (condensation hasn't happened yet). */
      var len=L*1.55, amp=w*1.0;
      var strand = function(off){
        return '<path d="M'+off+','+(-len/2)+' C '+(amp+off)+','+(-len/4)+' '+(-amp+off)+','+(-len/9)+' '+off+',0 C '+(amp+off)+','+(len/9)+' '+(-amp+off)+','+(len/4)+' '+off+','+(len/2)+'" fill="none" stroke="'+color+'" stroke-width="'+(w*0.34)+'" stroke-linecap="round"/>';
      };
      if(state==='loose2') return strand(-w*0.26) + strand(w*0.26);
      return strand(0);
    }
    /* condensed chromatid: a rounded rod that narrows at its midpoint (the
       centromere constriction), so a single chromatid already reads as one
       continuous strand with a visible waist. */
    var H = L*0.72, lobe = w*0.6, waist = w*0.14;
    var d = 'M0,'+(-H)+
      ' C '+lobe+','+(-H*0.78)+' '+lobe+','+(-H*0.2)+' '+waist+',0'+
      ' C '+lobe+','+(H*0.2)+' '+lobe+','+(H*0.78)+' 0,'+H+
      ' C '+(-lobe)+','+(H*0.78)+' '+(-lobe)+','+(H*0.2)+' '+(-waist)+',0'+
      ' C '+(-lobe)+','+(-H*0.2)+' '+(-lobe)+','+(-H*0.78)+' 0,'+(-H)+' Z';
    var chromatid = '<path d="'+d+'" fill="'+color+'"/>';
    if(state===1){
      /* single chromatid (post-separation): one strand, slight natural tilt */
      return '<g transform="rotate(10)">'+chromatid+'</g>';
    }
    /* state 2: two sister chromatids crossing at a shared centromere ->
       full four-armed chromosome shape, pinched at the middle where they meet */
    return '<g><g transform="rotate(-34)">'+chromatid+'</g><g transform="rotate(34)">'+chromatid+'</g></g>';
  }

  function sizeFor(pair, scale){
    var base = pair===1 ? {L:44,w:15.5} : {L:30,w:11.5};
    return {L:base.L*scale, w:base.w*scale};
  }

  function chromoInstance(c, scale){
    var sz=sizeFor(c.pair, scale);
    var color = c.origin==='mom' ? 'var(--chromo-mom)' : 'var(--chromo-dad)';
    return '<g transform="translate('+c.x+','+c.y+') rotate('+(c.rot||0)+')">'+chromoNode(c.state, color, sz.L, sz.w)+'</g>';
  }

  function cellNode(cell, gid){
    if(!cell.pinch){
      return '<circle cx="'+cell.cx+'" cy="'+cell.cy+'" r="'+cell.r+'" fill="url(#'+gid+')" stroke="var(--cell-line)" stroke-width="2"/>';
    }
    /* Anaphase: cytokinesis hasn't happened yet (this is still ONE cell,
       one continuous membrane), but as the two chromosome groups near the
       poles, the cell membrane starts to narrow at the middle, foreshadowing
       where the cleavage furrow will later split it in two. Drawn as a
       peanut/figure-8 outline, pinched along the spindle's pole-to-pole
       axis, rather than a plain circle. */
    var r = cell.r;
    var H = r*1.15, bulge = r*0.82, waist = r*0.3, capC = r*0.5, midC = r*0.45;
    /* Two round lobes (each with a smoothly rounded outer cap, like a
       circle) joined by a concave waist -- traced as 8 cubic beziers around
       the outline, rather than the 4-bezier chromatid shape (which comes to
       a point at each end and would look like a leaf, not a pinching cell). */
    var d = 'M0,'+(-H)+
      ' C '+capC+','+(-H)+' '+bulge+','+(-H*0.83)+' '+bulge+','+(-H*0.48)+
      ' C '+bulge+','+(-H*0.22)+' '+midC+','+(-H*0.05)+' '+waist+',0'+
      ' C '+midC+','+(H*0.05)+' '+bulge+','+(H*0.22)+' '+bulge+','+(H*0.48)+
      ' C '+bulge+','+(H*0.83)+' '+capC+','+H+' 0,'+H+
      ' C '+(-capC)+','+H+' '+(-bulge)+','+(H*0.83)+' '+(-bulge)+','+(H*0.48)+
      ' C '+(-bulge)+','+(H*0.22)+' '+(-midC)+','+(H*0.05)+' '+(-waist)+',0'+
      ' C '+(-midC)+','+(-H*0.05)+' '+(-bulge)+','+(-H*0.22)+' '+(-bulge)+','+(-H*0.48)+
      ' C '+(-bulge)+','+(-H*0.83)+' '+(-capC)+','+(-H)+' 0,'+(-H)+' Z';
    var rot = cell.pinchAxis==='horizontal' ? 90 : 0;
    return '<g transform="translate('+cell.cx+','+cell.cy+') rotate('+rot+')"><path d="'+d+'" fill="url(#'+gid+')" stroke="var(--cell-line)" stroke-width="2"/></g>';
  }

  function gradDefs(gid){
    return '<defs><radialGradient id="'+gid+'" cx="35%" cy="28%" r="78%">'+
      '<stop offset="0%" stop-color="var(--cell-grad-in)"/>'+
      '<stop offset="100%" stop-color="var(--cell-grad-out)"/>'+
      '</radialGradient></defs>';
  }

  function bracketNode(p1,p2,pad){
    pad = pad || 24;
    var cx=(p1.x+p2.x)/2, cy=(p1.y+p2.y)/2;
    var dx=p2.x-p1.x, dy=p2.y-p1.y;
    var dist=Math.sqrt(dx*dx+dy*dy);
    var angle=Math.atan2(dy,dx)*180/Math.PI;
    var rx=dist/2+pad*0.62, ry=pad;
    return '<g transform="translate('+cx+','+cy+') rotate('+angle+')"><ellipse rx="'+rx+'" ry="'+ry+'" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.9"/></g>';
  }

  function slotGhostNode(slot, scale){
    var rad = (slot.pair===1 ? 25 : 19) * scale;
    return '<circle cx="'+slot.x+'" cy="'+slot.y+'" r="'+rad+'" fill="var(--accent)" fill-opacity="0.07" stroke="var(--accent)" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 4"/>';
  }

  /* ---- spindle fibers (metaphase/anaphase only) ---- */
  function nearestCell(cells, pt){
    var best=cells[0], bestD=Infinity;
    cells.forEach(function(c){
      var dx=c.cx-pt.x, dy=c.cy-pt.y, d=dx*dx+dy*dy;
      if(d<bestD){ bestD=d; best=c; }
    });
    return best;
  }
  function fiberLine(p, c){
    return '<line x1="'+p.x+'" y1="'+p.y+'" x2="'+c.x+'" y2="'+c.y+'" stroke="var(--spindle)" stroke-width="1.1" stroke-dasharray="1.5 3" stroke-linecap="round" opacity="0.8"/>';
  }
  function poleMarkNode(p){
    return '<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="var(--spindle)"/>';
  }
  /* scene.spindle: 'bipolar' (fibers from BOTH poles to every point — used
     when each chromosome's two sister-chromatid kinetochores face opposite
     poles, as in mitosis/meiosis-II metaphase) or 'monopolar' (each point
     pulled by only its nearer pole — used at anaphase, and at meiosis-I
     metaphase where each homolog of a bivalent is oriented toward a single
     pole). points are the {x,y} centromere positions (either the answer-key
     chromosomes, or the workspace's slot targets) grouped by whichever cell
     they sit in. */
  function spindleSVG(scene, points){
    if(!scene.spindle || !points.length) return '';
    var mode = scene.spindle;
    var horizontal = scene.spindleAxis === 'horizontal';
    var groups = {};
    points.forEach(function(p){
      var cell = nearestCell(scene.cells, p);
      var key = cell.cx+','+cell.cy;
      (groups[key] = groups[key] || {cell:cell, pts:[]}).pts.push(p);
    });
    var out='';
    Object.keys(groups).forEach(function(k){
      var g=groups[k], cell=g.cell;
      var poleA, poleB;
      if(horizontal){
        poleA={x:cell.cx-cell.r*0.88, y:cell.cy};
        poleB={x:cell.cx+cell.r*0.88, y:cell.cy};
      } else {
        poleA={x:cell.cx, y:cell.cy-cell.r*0.88};
        poleB={x:cell.cx, y:cell.cy+cell.r*0.88};
      }
      g.pts.forEach(function(p){
        if(mode==='bipolar'){ out += fiberLine(poleA,p) + fiberLine(poleB,p); }
        else {
          var nearer = horizontal ? (p.x<cell.cx?poleA:poleB) : (p.y<cell.cy?poleA:poleB);
          out += fiberLine(nearer, p);
        }
      });
      out += poleMarkNode(poleA) + poleMarkNode(poleB);
    });
    return out;
  }

  function sceneSVG(scene, alt){

    parts.push(spindleSVG(scene, scene.chromosomes));
    (scene.brackets||[]).forEach(function(pair){
      var a=scene.chromosomes.filter(function(c){return c.id===pair[0];})[0];
      var b=scene.chromosomes.filter(function(c){return c.id===pair[1];})[0];
      if(a&&b) parts.push(bracketNode(a,b));
    });
    scene.chromosomes.forEach(function(c){ parts.push(chromoInstance(c, scene.scale||1)); });
    return '<svg viewBox="0 0 300 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+(alt||'염색체 다이어그램')+'">'+parts.join('')+'</svg>';
  }

  var MODES = {mitosis:mitosis, meiosis:meiosis};

  /* ============ decoy pieces (mixed into every tray) ============ */
  function buildDecoys(stage){
    var correctState = stage.correct.scene.chromosomes[0].state;
    var oppositeState = correctState===2 ? 1 : 2;
    var d1reason = correctState===2
      ? '이 조각은 이미 자매염색분체가 분리된 모습이에요. 지금 단계에는 아직 두 염색분체가 붙어 있어야 해요.'
      : '이 조각은 아직 두 염색분체가 붙어 있는 모습이에요. 지금 단계에는 이미 자매염색분체가 분리되어 있어야 해요.';
    var d2reason = '이 조각은 아직 응축되지 않은 간기 상태의 염색사예요. 지금 단계에는 어울리지 않아요.';
    return [
      {id:'decoy1', pair:1, origin:'mom', state:oppositeState, decoy:true, reason:d1reason},
      {id:'decoy2', pair:2, origin:'dad', state:'loose', decoy:true, reason:d2reason}
    ];
  }

  /* ============ app state ============ */
  var state = { mode:null, stageIdx:0 };
  var app = document.getElementById('app');

  function shuffled(arr){
    var a=arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function go(mode){
    state = {mode:mode, stageIdx:0, atIntro:true};
    render();
    window.scrollTo({top:0, behavior:'auto'});
  }
  function goHome(){
    state = {mode:null, stageIdx:0};
    render();
  }

  function ensureRuntime(stage){
    if(state.runtime && state.runtimeStageKey===stage.key) return;
    var slots = stage.correct.scene.chromosomes.map(function(c){
      return {id:c.id, pair:c.pair, origin:c.origin, state:c.state, x:c.x, y:c.y, filled:false};
    });
    var correctPieces = slots.map(function(s){
      return {id:'piece_'+s.id, pair:s.pair, origin:s.origin, state:s.state, decoy:false, location:'tray'};
    });
    var decoys = buildDecoys(stage).map(function(d){ d.location='tray'; return d; });
    state.runtime = { slots:slots, pieces: shuffled(correctPieces.concat(decoys)) };
    state.runtimeStageKey = stage.key;
    state.resolved = false;
    state.resolvedExplain = null;
    state.lastFeedback = null;
    state.lastBadPieceId = null;
  }

  function nextStage(){
    var m = MODES[state.mode];
    state.stageIdx++;
    state.runtime = null; state.runtimeStageKey=null;
    state.resolved=false; state.resolvedExplain=null; state.lastFeedback=null; state.lastBadPieceId=null;
    if(state.stageIdx >= m.stages.length){ state.done = true; }
    render();
    window.scrollTo({top:0, behavior:'auto'});
  }

  /* Matching is by CELL, not by exact slot position: within a cell, left-right
     order along the equator (or which "column" a chromosome sits in) carries
     no biological meaning, so any spot inside the correct cell that still
     needs this piece's chromosome (same pair/origin/state) accepts it. */
  function handleDrop(pieceId, clientX, clientY){
    var piece = state.runtime.pieces.filter(function(p){return p.id===pieceId;})[0];
    if(!piece) return;
    var wsEl = document.getElementById('workspace');
    var wsRect = wsEl.getBoundingClientRect();
    var inside = clientX>=wsRect.left && clientX<=wsRect.right && clientY>=wsRect.top && clientY<=wsRect.bottom;
    if(!inside){ state.lastFeedback=null; render(); return; }

    var fx=(clientX-wsRect.left)/wsRect.width*300;
    var fy=(clientY-wsRect.top)/wsRect.height*210;
    var stage = MODES[state.mode].stages[state.stageIdx];
    var scene = stage.correct.scene;
    var slots = state.runtime.slots;

    if(piece.decoy){
      state.lastFeedback={type:'no', text:piece.reason};
      state.lastBadPieceId=pieceId;
      render(); return;
    }

    var targetCell = nearestCell(scene.cells, {x:fx,y:fy});
    var cellSlots = slots.filter(function(s){ return nearestCell(scene.cells, s) === targetCell; });
    /* Homologous pairs assort independently at meiosis I, so which specific
       parent (mom/dad) ends up in which daughter cell is random per pair —
       origin isn't checked here when the stage marks itself origin-flexible,
       only that the right pair+condensation-state lands in the cell. */
    var checkOrigin = !scene.originFlexible;

    var match=null, matchD=Infinity;
    cellSlots.forEach(function(s){
      if(s.filled) return;
      if(s.pair===piece.pair && (!checkOrigin || s.origin===piece.origin) && s.state===piece.state){
        var dx=s.x-fx, dy=s.y-fy, d=dx*dx+dy*dy;
        if(d<matchD){ matchD=d; match=s; }
      }
    });

    if(match){
      match.filled=true;
      piece.location='placed'; piece.slotId=match.id;
      state.lastFeedback={type:'ok', text:'맞아요! 잘 놓았어요.'};
      state.lastBadPieceId=null;
      var allFilled = slots.every(function(s){return s.filled;});
      if(allFilled){
        state.resolved=true;
        state.resolvedExplain = stage.correct.explain;
      }
      render();
      return;
    }

    var alreadyThere = cellSlots.some(function(s){
      return s.filled && s.pair===piece.pair && (!checkOrigin || s.origin===piece.origin) && s.state===piece.state;
    });
    if(alreadyThere){
      state.lastFeedback={type:'no', text:'이미 같은 염색체가 놓여 있어요. 다른 조각을 놓아보세요.'};
    } else {
      state.lastFeedback={type:'no', text:'이 조각은 이 자리와 어울리지 않아요. 염색체의 크기와 색을 다시 확인해보세요.'};
    }
    state.lastBadPieceId=pieceId;
    render();
  }

  function attachDragHandlers(){
    var stageArea = document.getElementById('stageArea');
    var dragLayer = document.getElementById('dragLayer');
    if(!stageArea || !dragLayer) return;
    Array.prototype.forEach.call(app.querySelectorAll('.piece.in-tray'), function(el){
      el.addEventListener('pointerdown', function(e){
        if(state.resolved) return;
        e.preventDefault();
        var pid = el.getAttribute('data-pid');
        var saRect = stageArea.getBoundingClientRect();
        var elRect = el.getBoundingClientRect();
        var offsetX = e.clientX - (elRect.left+elRect.width/2);
        var offsetY = e.clientY - (elRect.top+elRect.height/2);
        el.classList.add('dragging');
        dragLayer.appendChild(el);

        function place(cx,cy){
          var x = cx - saRect.left - offsetX;
          var y = cy - saRect.top - offsetY;
          el.style.position='absolute';
          el.style.left = x+'px';
          el.style.top = y+'px';
          el.style.transform='translate(-50%,-50%)';
          el.style.pointerEvents='auto';
        }
        place(e.clientX, e.clientY);

        function onMove(ev){ place(ev.clientX, ev.clientY); }
        function onUp(ev){
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          document.removeEventListener('pointercancel', onUp);
          handleDrop(pid, ev.clientX, ev.clientY);
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      });
    });
  }

  function renderStepper(m){
    var html = '<div class="stepper">';
    m.stages.forEach(function(s,i){
      var cls = 'step';
      if(i < state.stageIdx || state.done) cls += ' done';
      else if(i === state.stageIdx && !state.done) cls += ' current';
      html += '<span class="'+cls+'"><span class="n">'+(i < state.stageIdx || state.done ? '✓' : (i+1))+'</span>'+s.label+'</span>';
    });
    html += '</div>';
    return html;
  }

  function renderStage(){
    var m = MODES[state.mode];
    var stage = m.stages[state.stageIdx];
    ensureRuntime(stage);

    var prevTitle, prevScene, prevNote;
    if(state.stageIdx === 0){
      prevTitle = m.intro.title; prevScene = m.intro.scene; prevNote = m.intro.afterNote;
    } else {
      var prevStage = m.stages[state.stageIdx-1];
      prevTitle = prevStage.full; prevScene = prevStage.correct.scene; prevNote = prevStage.correct.explain;
    }

    var scale = stage.correct.scene.scale || 1;
    var bgSvg = workspaceBgSVG(stage.correct.scene, state.runtime.slots);

    var placedHtml = state.runtime.pieces.filter(function(p){return p.location==='placed';}).map(function(p){
      var slot = state.runtime.slots.filter(function(s){return s.id===p.slotId;})[0];
      var leftPct = (slot.x/300*100), topPct=(slot.y/210*100);
      return '<div class="piece placed" style="position:absolute; left:'+leftPct+'%; top:'+topPct+'%; transform:translate(-50%,-50%) scale('+scale+');">'+pieceIconSVG(p.pair,p.origin,p.state)+'</div>';
    }).join('');

    var trayHtml = '';
    if(!state.resolved){
      trayHtml = '<div class="tray" id="tray"><span class="tray-label">염색체 조각 (끌어다 놓기)</span>' +
        state.runtime.pieces.filter(function(p){return p.location==='tray';}).map(function(p){
          var shakeCls = (state.lastBadPieceId===p.id) ? ' shake' : '';
          return '<div class="piece in-tray'+shakeCls+'" data-pid="'+p.id+'">'+pieceIconSVG(p.pair,p.origin,p.state)+'</div>';

          '<tr><td>상동염색체의 접합(2가염색체)</td><td>일어나지 않음</td><td>전기Ⅰ에서 일어남</td></tr>'+
          '<tr><td>딸세포 간 유전적 구성</td><td>서로 완전히 동일</td><td>서로 다름</td></tr>'+
          '<tr><td>일어나는 곳 / 목적</td><td>몸 전체의 세포 · 생장과 재생</td><td>생식기관 · 생식세포(정자·난자) 형성</td></tr>'+
        '</tbody></table></div>'+
        '<div class="complete-actions">'+
          '<button class="btn-primary" id="otherBtn" type="button">🔬 '+MODES[otherMode].short+' 체험하기</button>'+
          '<button class="btn-secondary" id="homeBtn2" type="button">처음 화면으로</button>'+
        '</div>'+
      '</div>'+
      '<footer class="foot">© 수민T의 과학실험실. All rights reserved.</footer>';

    document.getElementById('homeBtn').addEventListener('click', goHome);
    document.getElementById('homeBtn2').addEventListener('click', goHome);
    document.getElementById('otherBtn').addEventListener('click', function(){ go(otherMode); });
  }

  function renderIntro(){
    var m = MODES[state.mode];
    app.innerHTML =
      '<div class="topbar"><div class="brand"><span class="mark">🧬</span><h1>염색체 관찰소</h1><span class="tag">'+m.label+'</span></div>'+
      '<button class="home-btn" id="homeBtn" type="button">🏠 처음으로</button></div>'+
      '<div class="stage-head"><div class="kicker">분열 시작 전</div><h2>간기 (Interphase)</h2></div>'+
      '<div class="intro-lead">'+m.intro.lead+'</div>'+
      '<div class="intro-split">'+
        '<div class="intro-panel">'+
          '<div class="intro-panel-title">'+m.intro.beforeTitle+'</div>'+
          '<div class="intro-diagram">'+sceneSVG(introBeforeScene, m.intro.beforeTitle)+'</div>'+
          '<p>'+m.intro.beforeNote+'</p>'+
        '</div>'+
        '<div class="intro-panel">'+
          '<div class="intro-panel-title">'+m.intro.afterTitle+'</div>'+
          '<div class="intro-diagram">'+sceneSVG(introAfterScene, m.intro.afterTitle)+'</div>'+
          '<p>'+m.intro.afterNote+'</p>'+
        '</div>'+
      '</div>'+
      '<button class="next-btn" id="introNextBtn" type="button">'+m.stages[0].label+' 단계로 시작하기 →</button>'+
      '<footer class="foot">© 수민T의 과학실험실. All rights reserved.</footer>';

    document.getElementById('homeBtn').addEventListener('click', goHome);
    document.getElementById('introNextBtn').addEventListener('click', function(){
      state.atIntro = false;
      render();
      window.scrollTo({top:0, behavior:'auto'});
    });
  }

  function render(){
    if(!state.mode) return renderHome();
    if(state.atIntro) return renderIntro();
    if(state.done) return renderComplete();
    return renderStage();
  }

  render();
})();
</script>

</body>
